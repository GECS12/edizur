<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contactos — Edizur</title>
<meta name="description" content="Entre em contacto com a Edizur. Terrenos, imóveis e construção no Porto e região.">
<link rel="canonical" href="https://edizur.pt/contactos.html">
<meta name="theme-color" content="#EDEBE6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://a5nclqso.apicdn.sanity.io" crossorigin>
<link rel="stylesheet" href="fonts.css?v=20260918-15">
<link rel="stylesheet" href="styles.css?v=20260918-17">
<script>
  (() => {
    const theme = localStorage.getItem('edizur-theme');
    const lang = localStorage.getItem('edizur-lang') || 'pt';
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'pt-PT');
    document.documentElement.setAttribute('data-lang', lang);
  })();
</script>
</head>
<body class="page-contact" data-page="contact">

<main>
  <section class="contact-page" id="contacto">
    <div class="wrap contact-grid">
      <div class="contact-copy">
        <h1 data-i18n="contactTitle">Entre em contacto</h1>
        <p class="contact-intro" data-i18n="contactIntro">
          Venha conhecer melhor a Edizur e explorar oportunidades de aquisição de terrenos e imóveis para construção. Estamos disponíveis para apresentar soluções que agregam valor e confiança.
        </p>

        <form class="contact-form" id="contact-form" novalidate>
          <p class="honeypot" hidden>
            <label>Não preencher: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
          </p>

          <div class="form-row two">
            <label class="field">
              <span data-i18n="fieldFirstName">Nome</span>
              <input type="text" name="nome" required autocomplete="given-name" data-i18n-placeholder="phFirstName" placeholder="Nome (obrigatório)">
            </label>
            <label class="field">
              <span data-i18n="fieldLastName">Sobrenome</span>
              <input type="text" name="sobrenome" required autocomplete="family-name" data-i18n-placeholder="phLastName" placeholder="Sobrenome (obrigatório)">
            </label>
          </div>

          <label class="field">
            <span data-i18n="fieldEmail">E-mail</span>
            <input type="email" name="email" required autocomplete="email" data-i18n-placeholder="phEmail" placeholder="E-mail (obrigatório)">
          </label>

          <label class="field">
            <span data-i18n="fieldMessage">Mensagem</span>
            <textarea name="mensagem" rows="4" required data-i18n-placeholder="phMessage" placeholder="Mensagem (obrigatório)"></textarea>
          </label>

          <div class="form-actions">
            <button class="btn btn-outline" type="submit" data-i18n="formSend">Enviar</button>
          </div>
        </form>

        <p class="form-note" id="form-note" hidden></p>
      </div>

      <figure class="contact-visual">
        <img src="assets/contact.jpg?v=20260918-15" alt="Intercomunicador à entrada de um imóvel" width="292" height="396" loading="eager" decoding="async">
      </figure>
    </div>
  </section>
</main>

<script src="chrome.js?v=20260918-17"></script>
<script src="i18n.js?v=20260918-17"></script>
<script src="app.js?v=20260918-17"></script>
</body>
</html>
