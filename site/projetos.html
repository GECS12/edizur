<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos — Edizur</title>
<meta name="description" content="Portfólio Edizur: construção, remodelação e reabilitação no Porto e região.">
<link rel="canonical" href="https://edizur.pt/projetos.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Projetos — Edizur">
<meta property="og:description" content="Obras de construção e reabilitação desenvolvidas pela Edizur.">
<meta name="theme-color" content="#EDEBE6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://a5nclqso.apicdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://cdn.sanity.io">
<link rel="stylesheet" href="fonts.css?v=20260918-15">
<link rel="stylesheet" href="styles.css?v=20260918-23">
<script>
  (() => {
    const theme = localStorage.getItem('edizur-theme');
    const lang = localStorage.getItem('edizur-lang') || 'pt';
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'pt-PT');
    document.documentElement.setAttribute('data-lang', lang);
  })();
</script>
</head>
<body class="page-projects" data-page="projects">

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="eyebrow" data-i18n="projectsEyebrow">Portfólio</p>
      <h1 data-i18n="projectsTitle">Projetos desenvolvidos</h1>
      <p class="section-lead left" data-i18n="projectsLead">
        Construção, remodelação e reabilitação — obras que reflectem rigor e experiência.
      </p>
    </div>
  </section>

  <section class="projects" id="projetos">
    <div class="wrap">
      <div class="project-stack" id="projects-grid" aria-busy="true">
        <div class="project-row skeleton" aria-hidden="true"></div>
        <div class="project-row skeleton" aria-hidden="true"></div>
      </div>
      <p class="empty" id="projects-empty" hidden data-i18n="emptyProjects">Ainda não existem projetos publicados.</p>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" data-close aria-label="Fechar">
      <svg class="ico"><use href="#i-close"></use></svg>
    </button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="chrome.js?v=20260918-20"></script>
<script src="i18n.js?v=20260918-23"></script>
<script src="app.js?v=20260918-23"></script>
</body>
</html>
